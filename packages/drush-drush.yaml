package: drush/drush
frameworks:
  - name: drupal
    min: "8"

workers:
  cron:
    label: Cron
    icon: clock
    command: php vendor/drush/drush/drush.php cron
    restart: always

commands:
  - name: site:install
    label: Install site
    # The same script as the Drupal definitions' install block: until the
    # installer has run, the connection lives only in .env, as DB_* from older
    # releases and as the settings.php array keys from newer ones.
    command: >
      test -f vendor/drush/drush/drush.php || composer require drush/drush --no-interaction || exit 1;
      v() { sed -n -e "s/^DB_$1=//p" -e "s/^databases\.default\.default\.$2=//p" .env 2>/dev/null | tail -n 1; };
      driver=$(v DRIVER driver);
      test -n "$driver" || { echo "no database connection in .env, run lerd env first" >&2; exit 1; };
      if [ "$driver" = sqlite ]; then url="sqlite://$(v NAME database)";
      else url="$driver://$(v USER username):$(v PASSWORD password)@$(v HOST host):$(v PORT port)/$(v NAME database)"; fi;
      php vendor/drush/drush/drush.php site:install --yes --db-url="$url"
      --account-name=admin --account-pass=lerdadmin1
    description: Install a fresh site against the database lerd provisioned, admin user admin/lerdadmin1
    output: text
    confirm: true
    icon: play
  - name: cr
    label: Rebuild cache
    command: php vendor/drush/drush/drush.php cr
    description: Rebuild all Drupal caches
    output: silent
    icon: broom
  - name: uli
    label: Login as admin
    command: >
      set -a; . ./.env; set +a;
      php vendor/drush/drush/drush.php uli --uri="$APP_URL"
    description: Generate a one-time admin login URL
    output: url
    icon: key
  - name: updb
    label: Run database updates
    command: php vendor/drush/drush/drush.php updb -y
    description: Apply pending hook_update_N updates
    output: silent
    icon: database
  - name: cex
    label: Export config
    command: php vendor/drush/drush/drush.php cex -y
    description: Export configuration to the sync directory
    output: text
    icon: arrow-up
  - name: cim
    label: Import config
    command: php vendor/drush/drush/drush.php cim -y
    description: Import configuration from the sync directory
    output: text
    confirm: true
    icon: arrow-down

setup:
  - label: Run database updates
    command: php vendor/drush/drush/drush.php updatedb --yes
    default: true
  - label: Rebuild cache
    command: php vendor/drush/drush/drush.php cache:rebuild
    default: true
  - label: Import config
    command: php vendor/drush/drush/drush.php config:import --yes
    # A fresh install has no exported config, and importing an empty sync
    # directory is refused because it would delete the site's configuration.
    check:
      file: config/sync/system.site.yml
