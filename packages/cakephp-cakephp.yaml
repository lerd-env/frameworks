package: cakephp/cakephp

# Offered on the site's Debug tab: lerd/debug lets the app add its own rows,
# log lines and tabs to the Requests lens, and does nothing outside lerd.
suggest_packages:
  - name: lerd/debug
    dev: true
    reason: puts your own timeline rows, log lines and tabs in lerd's Requests lens
    docs: https://lerd.sh/features/debug-package/
