package: laravel/horizon
frameworks:
  - name: laravel
    min: "6"

workers:
  horizon:
    label: Horizon
    icon: horizon
    color: "#405263"
    command: php artisan horizon
    reload_command: php artisan horizon:listen
    restart: always
    conflicts_with:
      - queue

# The project talks to this service through the package, so the wizard ticks it.
suggest_services:
  - redis
