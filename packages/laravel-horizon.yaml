package: laravel/horizon
frameworks:
  - name: laravel
    min: "6"

workers:
  horizon:
    label: Horizon
    icon: horizon
    color: "#405263"
    command: php artisan horizon
    reload_command: php artisan horizon:listen
    restart: always
    conflicts_with:
      - queue

# Alternatives, most important first: lerd puts forward the first one this
# machine already runs, else the first, and none when the project uses one.
suggest_services:
  - name: redis
    reason: Horizon runs its queues on Redis
  - name: valkey
    reason: Redis-compatible queues for Horizon
