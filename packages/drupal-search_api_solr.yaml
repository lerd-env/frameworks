package: drupal/search_api_solr
# Search API Solr 4 supports Solr 9, the major lerd's preset runs, from Drupal 9.
frameworks:
  - name: drupal
    min: "9"

# The project talks to this service through the package, so the wizard ticks it.
suggest_services:
  - name: solr
    reason: Search API backend for this module
