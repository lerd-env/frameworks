package: "@hotwired/turbo"
type: npm

browser:
  preset: turbo
  label: Hotwire Turbo
  events:
    - event: turbo:fetch-request-error
      label: Turbo request failed
      message: detail.error.message
    - event: turbo:frame-missing
      label: Turbo frame missing
      message: detail.response.status
