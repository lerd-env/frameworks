package: codeigniter4/queue
frameworks:
  - name: codeigniter
    min: "4"

workers:
  queue:
    label: Queue Worker
    icon: queue
    command: php spark queue:work default
    # Parameterized variant for `lerd queue:start --queue/--tries`. CI4 takes the
    # queue name positionally and has no per-job timeout flag, so timeout is omitted.
    tune_command: php spark queue:work {queue} -tries={tries}
    restart: always

commands:
  - name: queue:retry
    label: Retry failed jobs
    command: php spark queue:retry all
    description: Retry every failed queue job
    output: silent
    icon: arrow-rotate-right
  - name: queue:failed
    label: Show failed jobs
    command: php spark queue:failed
    description: List failed queue jobs
    icon: list
  - name: queue:flush
    label: Flush failed jobs
    command: php spark queue:flush
    description: Remove all failed queue jobs
    output: silent
    confirm: true
    icon: trash

# The worker only loops; the Debug window reports the jobs it runs.
devtools:
  exclude_commands: [queue:work]
