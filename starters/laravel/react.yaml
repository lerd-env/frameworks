starter: react
label: React
description: Inertia and React with authentication, from Laravel's starter kit
framework:
  name: laravel
  # The kit publishes only its main branch, which tracks the newest Laravel, so
  # min moves up with each Laravel major.
  min: "13"
create: composer create-project --no-install --no-plugins --no-scripts --stability=dev laravel/react-starter-kit
