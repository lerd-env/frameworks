name: typo3
version: "13"
label: TYPO3
color: "#ff8700"
public_dir: public
create: composer create-project typo3/cms-base-distribution:^13.0
php:
  min: "8.2"
  max: "8.4"

detect:
  - composer: typo3/cms-core
  - file: public/typo3

env:
  file: .env
  format: dotenv
  app_file: config/system/settings.php
  app_format: php-array
  url_key: none
  services:
    mysql:
      detect:
        - key: DB.Connections.Default.driver
          value_prefix: pdo_mysql
        - key: DB.Connections.Default.driver
          value_prefix: mysqli
      vars:
        - DB.Connections.Default.driver=pdo_mysql
        - DB.Connections.Default.host=lerd-mysql
        - DB.Connections.Default.port=3306
        - DB.Connections.Default.dbname={{site}}
        - DB.Connections.Default.user=root
        - DB.Connections.Default.password=lerd
        - DB.Connections.Default.charset=utf8mb4
    postgres:
      detect:
        - key: DB.Connections.Default.driver
          value_prefix: pdo_pgsql
      vars:
        - DB.Connections.Default.driver=pdo_pgsql
        - DB.Connections.Default.host=lerd-postgres
        - DB.Connections.Default.port=5432
        - DB.Connections.Default.dbname={{site}}
        - DB.Connections.Default.user=postgres
        - DB.Connections.Default.password=lerd
    mailpit:
      detect:
        - key: MAIL.transport_smtp_server
      vars:
        - MAIL.transport=smtp
        - MAIL.transport_smtp_server=lerd-mailpit:1025
        - MAIL.transport_smtp_encrypt=
        - MAIL.defaultMailFromAddress=lerd@{{domain}}
        - MAIL.defaultMailFromName={{site}}
  sqlite:
    detect:
      - key: DB.Connections.Default.driver
        value_prefix: pdo_sqlite
    vars:
      - DB.Connections.Default.driver=pdo_sqlite
      - DB.Connections.Default.path=var/sqlite/typo3.sqlite

composer: auto
npm: false
# Offered unticked in the setup wizard; apache-solr-for-typo3/solr ticks it.
suggest_services:
  - name: solr
    reason: Search backend for EXT:solr
console: vendor/bin/typo3
cache_command: cache:flush

workers:
  scheduler:
    label: Scheduler
    icon: clock
    command: php vendor/bin/typo3 scheduler:run
    schedule: minutely
    check:
      composer: typo3/cms-scheduler

setup:
  - label: Set up extensions
    command: php vendor/bin/typo3 extension:setup
    default: true
  - label: Run upgrade wizards
    command: php vendor/bin/typo3 upgrade:run
  - label: Flush caches
    command: php vendor/bin/typo3 cache:flush
    default: true

commands:
  - name: setup
    label: Install site
    command: >
      php vendor/bin/typo3 setup --no-interaction --force
      --driver=pdoMysql
      --host=lerd-mysql
      --port=3306
      --dbname={{site}}
      --username=root
      --password=lerd
      --admin-username=admin
      --admin-user-password='Lerd.Admin.1234'
      --admin-email=admin@{{domain}}
      --project-name='{{site}}'
      --create-site='{{scheme}}://{{domain}}/'
      --server-type=other
    description: Install TYPO3 against the database lerd provisioned, admin user admin/Lerd.Admin.1234
    output: text
    confirm: true
    icon: play
  - name: flush
    label: Flush caches
    command: php vendor/bin/typo3 cache:flush
    description: Flush all TYPO3 caches
    output: silent
    icon: broom
  - name: warmup
    label: Warm caches
    command: php vendor/bin/typo3 cache:warmup
    description: Warm up all TYPO3 caches
    output: silent
    icon: refresh
  - name: extension-setup
    label: Set up extensions
    command: php vendor/bin/typo3 extension:setup
    description: Run the database schema and static data setup for all extensions
    output: text
    icon: database
  - name: upgrade
    label: Run upgrade wizards
    command: php vendor/bin/typo3 upgrade:run
    description: Run all pending TYPO3 upgrade wizards
    output: text
    confirm: true
    icon: arrow-up
  - name: scheduler
    label: Run scheduler
    command: php vendor/bin/typo3 scheduler:run
    description: Execute all scheduler tasks that are due
    output: text
    icon: list
    check:
      composer: typo3/cms-scheduler

doctor:
  migrate_command: extension-setup
# The phases of a TYPO3 request: booting, matching the site and the page, the
# frontend or backend middleware stack, the page handler at its bottom, each
# Extbase controller and Fluid view inside it, and sending the response. The
# frontend route is the page uid, the backend one the route identifier. The
# user is read as the frontend or backend user aspect is set.
# Scheduler tasks do their work in execute(), the closest thing TYPO3 has to a
# queued job, and messenger:consume only loops.
devtools:
  exclude_commands: [messenger:consume]
  jobs:
    - extends: TYPO3\CMS\Scheduler\Task\AbstractTask
      method: execute
  captures:
    - kind: span
      class: TYPO3\CMS\Core\Core\Bootstrap
      method: init
      label: Bootstrap
    - kind: span
      class: TYPO3\CMS\Core\Routing\SiteMatcher
      method: matchRequest
      label: Routing
    - kind: span
      class: TYPO3\CMS\Core\Routing\PageRouter
      method: matchRequest
      label: Routing
    - kind: span
      class: TYPO3\CMS\Frontend\Http\Application
      method: handle
      label: Middleware
    - kind: span
      class: TYPO3\CMS\Backend\Http\Application
      method: handle
      label: Middleware
    - kind: span
      class: TYPO3\CMS\Frontend\Http\RequestHandler
      method: handle
      label: Handle
    - kind: span
      implements: TYPO3\CMS\Extbase\Mvc\Controller\ControllerInterface
      method: processRequest
      name: this
      label: Controller
    - kind: span
      class: TYPO3Fluid\Fluid\View\AbstractTemplateView
      method: render
      name: arg:1
      label: View
    - kind: span
      class: TYPO3\CMS\Core\Http\AbstractApplication
      method: sendResponse
      label: Send response
    - kind: route
      class: TYPO3\CMS\Frontend\Page\PageInformation
      method: setId
      name: arg:1
    - kind: route
      class: TYPO3\CMS\Backend\Routing\RouteResult
      method: getRoute
      name: this.method:getRouteName
    - kind: auth
      class: TYPO3\CMS\Frontend\Authentication\FrontendUserAuthentication
      method: createUserAspect
      name: this.method:getUserId
    - kind: auth
      class: TYPO3\CMS\Core\Middleware\BackendUserAuthenticator
      method: setBackendUserAspect
      name: arg:1.method:getUserId
