name: codeigniter
version: "3"
label: CodeIgniter
color: "#ef4223"
public_dir: .
create: composer create-project codeigniter/framework:^3.0

php:
  min: "7.2"
  max: "7.4"

# CodeIgniter 3 has no spark CLI and no composer entry of its own in most
# projects, so it is recognised by the framework directory the installer lays
# down next to the front controller.
detect:
  # The v3 skeleton is the framework itself, so composer.json never requires
  # codeigniter/framework and the major has to come off the source constant.
  # It changed shape during 3.x: define('CI_VERSION', '3.0.6') up to 3.1.0,
  # const CI_VERSION = '3.1.1' from there on, so both spellings are matched.
  - file: system/core/CodeIgniter.php
    version_file: system/core/CodeIgniter.php
    version_pattern: "CI_VERSION'?\\s*[=,]\\s*'([^']+)'"
  - composer: codeigniter/framework

# Configuration lives in PHP files under application/config rather than a
# dotenv file, so there is nothing for lerd to write connection values into.
env:
  file: ""
  format: none

composer: auto
npm: false

# No console: CodeIgniter 3 ships no CLI runner, so there are no workers, no
# setup commands and no tinker.

logs:
  - path: application/logs/log-*.php
    format: plain
