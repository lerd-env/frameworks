name: drupal
version: "11"
label: Drupal
color: "#0678be"
public_dir: web
favicon: core/misc/favicon.ico
create: composer create-project drupal/recommended-project:^11.0
php:
  min: "8.3"
  max: "8.5"
  cli_ini:
    memory_limit: 512M

detect:
  - composer: drupal/core-recommended
  - composer: drupal/core

env:
  # A binary older than the php-vars format reads these three and behaves as it
  # always has, writing constants into settings.php that Drupal ignores.
  file: .env
  format: dotenv
  fallback_file: web/sites/default/settings.php
  fallback_format: php-const
  # A binary that knows the field writes the array Drupal actually reads.
  app_file: web/sites/default/settings.php
  app_format: php-vars
  url_key: none
  sqlite:
    detect:
      - key: databases.default.default.driver
        value_prefix: sqlite
    vars:
      - databases.default.default.driver=sqlite
      - databases.default.default.database=sites/default/files/.ht.sqlite
      - 'databases.default.default.namespace=Drupal\sqlite\Driver\Database\sqlite'
      - databases.default.default.autoload=core/modules/sqlite/src/Driver/Database/sqlite/
  services:
    mysql:
      detect:
        - key: databases.default.default.driver
          value_prefix: mysql
      vars:
        - databases.default.default.driver=mysql
        - databases.default.default.host=lerd-mysql
        - databases.default.default.port=3306
        - databases.default.default.database={{site}}
        - databases.default.default.username=root
        - databases.default.default.password=lerd
        - databases.default.default.namespace=Drupal\mysql\Driver\Database\mysql
        - databases.default.default.autoload=core/modules/mysql/src/Driver/Database/mysql/
    postgres:
      detect:
        - key: databases.default.default.driver
          value_prefix: pgsql
      vars:
        - databases.default.default.driver=pgsql
        - databases.default.default.host=lerd-postgres
        - databases.default.default.port=5432
        - databases.default.default.database={{site}}
        - databases.default.default.username=postgres
        - databases.default.default.password=lerd
        - databases.default.default.namespace=Drupal\pgsql\Driver\Database\pgsql
        - databases.default.default.autoload=core/modules/pgsql/src/Driver/Database/pgsql/
composer: auto
npm: false
console: vendor/drush/drush/drush.php
# Run after a connection change: the compiled container is built
# against the old database and answers every request with an error.
cache_command: cr

workers:
  cron:
    label: Cron
    icon: clock
    command: php vendor/drush/drush/drush.php cron
    restart: always
    check:
      composer: drush/drush

setup:
  - label: Run database updates
    command: php vendor/drush/drush/drush.php updatedb --yes
    default: true
    check:
      composer: drush/drush
  - label: Rebuild cache
    command: php vendor/drush/drush/drush.php cache:rebuild
    default: true
    check:
      composer: drush/drush
  - label: Import config
    command: php vendor/drush/drush/drush.php config:import --yes
    check:
      composer: drush/drush

tinker:
  command: ["vendor/drush/drush/drush.php", "php:eval"]
  execute_positional: true
  requires_package: drush/drush
  requires_file: vendor/drush/drush/drush.php

commands:
  # site:install drops and recreates the schema, and `lerd setup --all` runs
  # every setup step regardless of `default`, so this is a confirm-gated
  # command rather than a setup step.
  - name: site:install
    label: Install site
    # The connection is read out of the .env lerd wrote rather than templated
    # in: {{…}} placeholders are only expanded from lerd v1.29, and an older
    # install would take them literally and install a whole site into a
    # database named "{{site}}". Sourcing .env also picks up whichever engine
    # the project uses, since DB_DRIVER already holds drush's scheme name.
    command: >
      set -a; . ./.env; set +a;
      php vendor/drush/drush/drush.php site:install --yes
      --db-url="$DB_DRIVER://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME"
      --account-name=admin --account-pass=lerdadmin1
    description: Install a fresh site against the database lerd provisioned, admin user admin/lerdadmin1
    output: text
    confirm: true
    icon: play
    check:
      composer: drush/drush
  - name: cr
    label: Rebuild cache
    command: php vendor/drush/drush/drush.php cr
    description: Rebuild all Drupal caches
    output: silent
    icon: broom
    check:
      composer: drush/drush
  - name: uli
    label: Login as admin
    command: >
      set -a; . ./.env; set +a;
      php vendor/drush/drush/drush.php uli --uri="$APP_URL"
    description: Generate a one-time admin login URL
    output: url
    icon: key
    check:
      composer: drush/drush
  - name: updb
    label: Run database updates
    command: php vendor/drush/drush/drush.php updb -y
    description: Apply pending hook_update_N updates
    output: silent
    icon: database
    check:
      composer: drush/drush
  - name: cex
    label: Export config
    command: php vendor/drush/drush/drush.php cex -y
    description: Export configuration to the sync directory
    output: text
    icon: arrow-up
    check:
      composer: drush/drush
  - name: cim
    label: Import config
    command: php vendor/drush/drush/drush.php cim -y
    description: Import configuration from the sync directory
    output: text
    confirm: true
    icon: arrow-down
    check:
      composer: drush/drush

doctor:
  migrate_command: updb

notifications:
  # The entity, config and cache layers issue the repeats during an ordinary
  # request, so the warning names a loop inside the framework rather than
  # anything a site's own code does.
  nplusone: false
# Queue items. Every queue worker is a plugin implementing this interface, so
# one seam covers cron and drush queue runs alike.
devtools:
  jobs:
    - implements: Drupal\Core\Queue\QueueWorkerInterface
      method: processItem
