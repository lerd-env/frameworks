name: yii2
version: "2"
label: Yii 2
color: "#b8dc4d"
public_dir: web
create: composer create-project yiisoft/yii2-app-basic:^2.0
php:
  min: "7.4"
  max: "8.4"
detect:
  - file: "yii"
  - composer: "yiisoft/yii2"

env:
  file: "config/db.php"
  example_file: "config/db.php.example"
  format: php-array
  services:
    sqlite:
      detect:
        - key: "dsn"
          value_prefix: "sqlite:"
      vars:
        - "dsn=sqlite:/var/www/html/runtime/database.db"
    mysql:
      detect:
        - key: "dsn"
          value_prefix: "mysql:"
        - key: "dsn"
          value_prefix: "mariadb:"
      vars:
        - "dsn=mysql:host=lerd-mysql;dbname={{site}}"
        - "username=root"
        - "password=lerd"
    postgres:
      detect:
        - key: "dsn"
          value_prefix: "pgsql:"
      vars:
        - "dsn=pgsql:host=lerd-postgres;dbname={{site}}"
        - "username=postgres"
        - "password=lerd"
    redis:
      detect:
        - key: "class"
          value_prefix: "yii\\redis\\Cache"
        - key: "class"
          value_prefix: "yii\\queue\\redis\\Queue"
      vars:
        - "class=yii\\redis\\Cache"
        - "redis.host=lerd-redis"
        - "redis.port=6379"

workers:
  queue:
    label: Queue Worker
    icon: queue
    command: php yii queue/run --verbose
    requires_service:
      name: redis
      when_env: "class=yii\\queue\\redis\\Queue"
    restart: always
    check:
      composer: "yiisoft/yii2-queue"

setup:
  - label: Set permissions
    command: mkdir -p runtime assets && chmod -R 777 runtime assets
    default: true
  - label: Run migrations
    command: php yii migrate --interactive=0
    default: true
  - label: Load fixtures
    command: php yii fixture/load "*" --interactive=0
    default: false

tinker:
  command: ["yii", "shell"]
  execute_flag: "--execute"
  requires_package: "yiisoft/yii2-shell"
  requires_file: "yii"

commands:
  - name: cache:flush
    label: Flush cache
    description: Clear all application caches
    icon: cache
    command: php yii cache/flush-all
  - name: migrate
    label: Run migrations
    description: Apply database migrations
    icon: database
    command: php yii migrate --interactive=0
  - name: migrate:create
    label: Create migration
    description: Generate a new migration file
    icon: code
    command: php yii migrate/create {{name}} --migrationPath=@app/migrations
  - name: gii
    label: Gii code generator
    description: Launch Gii web interface
    icon: code
    command: php yii gii --interactive=0

doctor:
  migrate_command: migrate
  health_check: "curl -sf http://localhost/index.php > /dev/null || exit 1"
  check_composer: "yiisoft/yii2"
