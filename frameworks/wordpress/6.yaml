name: wordpress
version: "6"
label: WordPress
color: "#21759b"
public_dir: .
create: composer create-project --no-install --no-plugins --no-scripts johnpbloch/wordpress-core:^6.0
php:
  min: "7.4"
  max: "8.4"
  # wp-cli unzips core and dumps databases in one process; 128M is not enough.
  cli_ini:
    memory_limit: 512M
    # lerd's wp-cli phar bundles code PHP 8.5 deprecates; keep notices off stdout
    # so piped wp output stays clean, and off the terminal for PHP's own ones.
    display_errors: stderr
    error_reporting: "24575"

detect:
  - file: wp-login.php
    version_file: wp-includes/version.php
    version_pattern: "\\$wp_version\\s*=\\s*'([^']+)'"
  - file: wp-config.php

env:
  fallback_file: wp-config.php
  fallback_format: php-const
  app_file: wp-config.php
  app_format: php-const
  example_file: wp-config-sample.php
  url_key: WP_HOME
  services:
    mysql:
      detect:
        - key: DB_HOST
      vars:
        - DB_NAME={{site}}
        - DB_USER=root
        - DB_PASSWORD=lerd
        - DB_HOST=lerd-mysql

logs:
  - path: wp-content/debug.log
    format: raw

composer: false
npm: false

# wp-cli refuses to start as root and lerd's containers are root, so the flag
# rides along on `lerd wp` instead of every user having to type it.
vendor_bin_args:
  wp:
    - --allow-root

# Without composer's wp-cli, lerd wp runs the wp-cli lerd pins in its tools
# manifest, fetched on first use.
vendor_bin_tools:
  wp: wp-cli

tinker:
  command: ["vendor/wp-cli/wp-cli/php/boot-fs.php", "eval", "--allow-root"]
  execute_positional: true
  requires_package: wp-cli/wp-cli
  requires_file: vendor/wp-cli/wp-cli/php/boot-fs.php

# wp-cli ships a shell wrapper as its composer binary, so the PHP entrypoint is
# what lerd's php can run, and the containers are root, hence --allow-root.
commands:
  - name: cache:flush
    label: Flush cache
    command: php vendor/wp-cli/wp-cli/php/boot-fs.php cache flush --allow-root
    description: Flush the WordPress object cache
    output: silent
    icon: broom
    check:
      file: vendor/wp-cli/wp-cli/php/boot-fs.php
  - name: rewrite:flush
    label: Flush rewrites
    command: php vendor/wp-cli/wp-cli/php/boot-fs.php rewrite flush --allow-root
    description: Regenerate permalink rules
    output: silent
    icon: refresh
    check:
      file: vendor/wp-cli/wp-cli/php/boot-fs.php

notifications:
  # The entity, config and cache layers issue the repeats during an ordinary
  # request, so the warning names a loop inside the framework rather than
  # anything a site's own code does.
  nplusone: false
# Background jobs. Action Scheduler is what WordPress plugins queue work
# through; the action reports the hook it runs rather than its own class.
devtools:
  jobs:
    - class: ActionScheduler_Action
      method: execute
      name: this.method:get_hook
