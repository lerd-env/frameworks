name: django
version: "6"
label: Django
color: "#092e20"
public_dir: .

detect:
  - package:
      file: requirements.txt
      name: django
    version_file: requirements.txt
    version_pattern: '(?im)^django(?:\[[^\]]*\])?\s*[=~><]+\s*(\d+)'
  - package:
      file: pyproject.toml
      name: django
    version_file: pyproject.toml
    version_pattern: '(?i)["'']?django(?:\[[^\]]*\])?["'']?\s*[=~><"^]+[^0-9\n]{0,4}(\d+)'

# The project's own virtualenv when it has one. ALLOWED_HOSTS has to list the
# site's domain, for example '.test'.
dev_server:
  command: sh -c 'p=python3; [ -x .venv/bin/python ] && p=.venv/bin/python; exec $p manage.py runserver "$HOST:$PORT"'
  port: 8000
  move_port: true

env:
  file: .env
  example_file: .env.example
  format: dotenv
  url_key: none
  services:
    postgres:
      detect:
        - key: DATABASE_URL
          value_prefix: "postgres://"
        - key: DATABASE_URL
          value_prefix: "postgresql://"
      vars:
        - "DATABASE_URL=postgres://postgres:lerd@lerd-postgres:5432/{{site}}"
    mysql:
      detect:
        - key: DATABASE_URL
          value_prefix: "mysql://"
      vars:
        - "DATABASE_URL=mysql://root:lerd@lerd-mysql:3306/{{site}}"
    redis:
      detect:
        - key: REDIS_URL
      vars:
        - "REDIS_URL=redis://lerd-redis:6379/0"

composer: "false"

commands:
  - name: migrate
    label: Migrate
    command: $([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3) manage.py migrate
    description: Apply pending migrations
    icon: database
  - name: makemigrations
    label: Make migrations
    command: $([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3) manage.py makemigrations
    description: Write migrations for changed models
    icon: database
  - name: check
    label: Check
    command: $([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3) manage.py check
    description: Run Django's system checks

doctor:
  checks:
    - name: system_check
      type: command
      label: System Check
      command: $([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3) manage.py check
      detail: manage.py check reports a problem, run it to see which.
      timeout_seconds: 30
    - name: migrations
      type: command
      label: Migrations
      command: $([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3) manage.py migrate --check
      fix: migrate
      severity: warn
      detail: There are migrations to apply, or the database cannot be reached.
      timeout_seconds: 30
