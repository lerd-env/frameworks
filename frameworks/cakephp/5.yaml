name: cakephp
version: "5"
label: CakePHP
color: "#d33c43"
public_dir: webroot
create: composer create-project cakephp/app:^5.0
php:
  min: "8.1"
  max: "8.4"

detect:
  - file: bin/cake
  - composer: cakephp/cakephp

env:
  file: config/.env
  example_file: config/.env.example
  format: dotenv
  # CakePHP's skeleton ships the dotenv loader in config/bootstrap.php commented
  # out, and josegonzalez/dotenv only as a suggestion, so config/.env is not read
  # unless the developer opts in. app_local.php is what the application always
  # reads, and where its own installer puts the connection.
  app_file: config/app_local.php
  app_format: php-array
  url_key: App.fullBaseUrl
  sqlite:
    detect:
      - key: Datasources.default.driver
        value_prefix: 'Cake\Database\Driver\Sqlite'
    vars:
      - 'Datasources.default.driver=Cake\Database\Driver\Sqlite'
      - Datasources.default.database=database/database.sqlite
  services:
    mysql:
      detect:
        - key: Datasources.default.driver
          value_prefix: "Cake\\Database\\Driver\\Mysql"
      vars:
        - "Datasources.default.driver=Cake\\Database\\Driver\\Mysql"
        - "Datasources.default.host=lerd-mysql"
        - "Datasources.default.port=3306"
        - "Datasources.default.username=root"
        - "Datasources.default.password=lerd"
        - "Datasources.default.database={{site}}"
    postgres:
      detect:
        - key: Datasources.default.driver
          value_prefix: "Cake\\Database\\Driver\\Postgres"
      vars:
        - "Datasources.default.driver=Cake\\Database\\Driver\\Postgres"
        - "Datasources.default.host=lerd-postgres"
        - "Datasources.default.port=5432"
        - "Datasources.default.username=postgres"
        - "Datasources.default.password=lerd"
        - "Datasources.default.database={{site}}"
    redis:
      detect:
        - key: Cache.default.className
          value_prefix: "Cake\\Cache\\Engine\\RedisEngine"
      vars:
        - "Cache.default.className=Cake\\Cache\\Engine\\RedisEngine"
        - "Cache.default.host=lerd-redis"
        - "Cache.default.port=6379"
    mailpit:
      detect:
        - key: EmailTransport.default.host
          value_prefix: "lerd-mailpit"
      vars:
        - "EmailTransport.default.className=Cake\\Mailer\\Transport\\SmtpTransport"
        - "EmailTransport.default.host=lerd-mailpit"
        - "EmailTransport.default.port=1025"
composer: auto
npm: auto
console: bin/cake.php
# Run after a connection change: the compiled container is built
# against the old database and answers every request with an error.
cache_command: cache clear_all

workers:
  queue:
    label: Queue Worker
    icon: queue
    command: bin/cake queue worker
    restart: always
    check:
      composer: cakephp/queue
  vite:
    icon: vite
    color: "#9135ff"
    per_worktree: true
    replaces_build: true
    label: Vite
    command: npm run dev
    restart: on-failure
    host: true
    check:
      file: node_modules/vite

logs:
  - path: logs/*.log
    format: raw

setup:
  - label: Run migrations
    command: bin/cake migrations migrate
    default: true
  - label: Clear cache
    command: bin/cake cache clear_all
    default: true
  - label: Build schema cache
    command: bin/cake schema_cache build
    default: true

commands:
  - name: cache:clear
    label: Clear all caches
    command: bin/cake cache clear_all
    description: Clear every configured cache pool
    output: silent
    icon: broom
  - name: migrate
    label: Run migrations
    command: bin/cake migrations migrate
    description: Apply pending migrations
    output: silent
    icon: database
    check:
      composer: cakephp/migrations
  - name: schema:cache:clear
    label: Clear schema cache
    command: bin/cake schema_cache clear
    description: Drop the cached database schema
    output: silent
    icon: refresh

doctor:
  migrate_command: migrate
# Queued jobs. The Queue plugin runs every job through its own interface, so
# one seam covers whatever the project queues.
devtools:
  jobs:
    - implements: Cake\Queue\Job\JobInterface
      method: execute
