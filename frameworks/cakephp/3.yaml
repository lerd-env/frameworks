name: cakephp
version: "3"
label: CakePHP
color: "#d33c43"
public_dir: webroot
create: composer create-project cakephp/app:^3.0
php:
  min: "7.2"
  max: "7.4"

detect:
  - file: bin/cake
  - composer: cakephp/cakephp

env:
  file: config/.env
  example_file: config/.env.example
  format: dotenv
  url_key: APP_URL
  sqlite:
    detect:
      - key: Datasources.default.driver
        value_prefix: 'Cake\Database\Driver\Sqlite'
    vars:
      - 'Datasources.default.driver=Cake\Database\Driver\Sqlite'
      - Datasources.default.database=database/database.sqlite
  services:
    mysql:
      detect:
        - key: DATABASE_URL
          value_prefix: "mysql://"
      vars:
        - "DATABASE_URL=mysql://root:lerd@lerd-mysql:3306/{{site}}"
    postgres:
      detect:
        - key: DATABASE_URL
          value_prefix: "postgres://"
      vars:
        - "DATABASE_URL=postgres://postgres:lerd@lerd-postgres:5432/{{site}}"
    redis:
      detect:
        - key: CACHE_URL
          value_prefix: "redis://"
      vars:
        - "CACHE_URL=redis://lerd-redis:6379"
    mailpit:
      detect:
        - key: EMAIL_TRANSPORT_DEFAULT_URL
      vars:
        - "EMAIL_TRANSPORT_DEFAULT_URL=smtp://lerd-mailpit:1025"

composer: auto
npm: auto
console: bin/cake.php
# Run after a connection change: the compiled container is built
# against the old database and answers every request with an error.
cache_command: cache clear_all

logs:
  - path: logs/*.log
    format: raw

setup:
  - label: Run migrations
    command: bin/cake migrations migrate
    default: true
  - label: Clear cache
    command: bin/cake cache clear_all
    default: true

commands:
  - name: cache:clear
    label: Clear all caches
    command: bin/cake cache clear_all
    description: Clear every configured cache pool
    output: silent
    icon: broom
  - name: migrate
    label: Run migrations
    command: bin/cake migrations migrate
    description: Apply pending migrations
    output: silent
    icon: database
    check:
      composer: cakephp/migrations
  - name: schema:cache:clear
    label: Clear schema cache
    command: bin/cake schema_cache clear
    description: Drop the cached database schema
    output: silent
    icon: refresh

doctor:
  migrate_command: migrate

# Where the schema migrations live; comparing it across checkouts picks a new worktree's database.
worktree:
  migrations: config/Migrations
