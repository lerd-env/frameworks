name: kirby
version: "5"
label: Kirby
color: "#000000"
# The starterkit serves from the project root, where index.php sits beside the
# kirby, site and content folders; Kirby guards those itself through its router.
public_dir: .
create: composer create-project getkirby/starterkit:^5.0
php:
  min: "8.2"
  max: "8.5"

# A Kirby site is just as often a downloaded kit with no composer.json of its
# own, so the core folder it ships is detected too, with the major read from
# the composer.json inside it.
detect:
  - composer: getkirby/cms
  - file: kirby/bootstrap.php
    version_file: kirby/composer.json
    version_pattern: '"version":\s*"([^"]+)"'

# Kirby's .htaccess keeps content, config and its own source off the web;
# nginx never reads it, so the same rules from Kirby's nginx guide go here.
nginx:
  snippet: |
    location ~ ^/content/.*\.(txt|md|mdown)$ {
        return 404;
    }
    location ~ ^/(site|kirby|vendor)/ {
        return 404;
    }
    location ~ ^/(composer\.(json|lock)$|\.(?!well-known/)) {
        return 404;
    }

# Kirby is a flat-file CMS: content lives in content/ and config in PHP under
# site/config, so there is no env file and no database.
env:
  file: ""
  format: none

composer: auto
npm: auto

commands:
  - name: clear-cache
    label: Clear cache
    command: rm -rf site/cache/* media/*
    description: Drop the page cache and generated thumbnails so they are rebuilt on demand
    output: silent
    icon: broom
    confirm: true
