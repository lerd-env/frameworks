name: laminas
version: "3"
label: Laminas
color: "#68b604"
public_dir: public
create: composer create-project laminas/laminas-mvc-skeleton:^2.0
php:
  min: "8.1"
  max: "8.3"

# Laminas is the Zend Framework renamed, so a project that never moved off the
# zendframework packages is the same application and is recognised too. The
# skeleton's own major (2) is not the framework's; laminas-mvc's is.
detect:
  - composer: laminas/laminas-mvc
  - composer: zendframework/zend-mvc

# Configuration is PHP arrays under config/autoload, merged at boot, and the
# skeleton reads no dotenv, so there is nothing for lerd to write into.
env:
  file: ""
  format: none

composer: auto
npm: auto

commands:
  - name: development-enable
    label: Enable development mode
    command: composer development-enable
    description: Turn on the development config overrides and disable the config cache
    output: silent
    icon: edit
    check:
      composer: laminas/laminas-development-mode
  - name: development-disable
    label: Disable development mode
    command: composer development-disable
    description: Go back to the production config and its cache
    output: silent
    icon: edit
    check:
      composer: laminas/laminas-development-mode
